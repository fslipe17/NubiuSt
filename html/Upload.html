<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - NimbuStorage</title>
    <link rel="stylesheet" href="../css/upload.css">
</head>
    <body>
        
        <header class="cabecalho-aside">
            <h1>NimbuStorage</h1>

            <a class="botao-meus-arquivos" href="./html/MyFiles.html">
                <img class="icone-meus-arquivos" src="../img/arquivo-de-banco-de-dados.png" alt="Ícone de Meus Arquivos">
                <h3 class="titulo-botao-meus-arquivos">Meus Arquivos</h3>
            </a>
            <a class="botao-upload" href="./html/Upload.html">
                <img class="icone-upload" src="../img/upload-na-nuvem.png" alt="Ícone de Upload">
                <h3 class="titulo-botao-upload">Upload</h3>
            </a>
            <a class="botao-arquivos-compartilhados" href="./html/arqCompartilhados.html">
                <img class="icone-arquivos-compartilhados" src="../img/compartilhamento-de-arquivos.png" alt="Ícone de Arquivos Compartilhados">
                <h3 class="titulo-botao-arquivos-compartilhados">Arquivos Compartilhados</h3>
            </a>
            <a class="botao-configuracoes" href="./html/configuracoes.html">
                <img class="icone-configuracoes" src="../img/configuracoes-de-sistema.png" alt="Ícone de Configurações">
                <h3 class="titulo-botao-configuracoes">Configurações</h3>
            </a>

            <div class="indicador de armazenamento">
                <p>10 GB de 100 GB utilizados</p>
            </div>
        </header>

        <main>
            <header class="cabecalho-main">
                <div class="botao-perfil">
                    <img class="foto-perfil" src="../img/perfil.jpeg" alt="Foto de Perfil">
                </div>
            </header>
            
            <section class="conteudo-principal" >
                <div class="area-upload">

                    <div class="icone-upload-area">
                        ☁️
                    </div>

                    <h2>Escolha um arquivo ou arraste aqui</h2>

                    <p>Selecione um arquivo do seu computador para enviar ao NimbuStorage.</p>

                    <p id="nome-arquivo"></p>

                    <label for="arquivo" class="botao-escolher-arquivo">
                        Escolher arquivo
                    </label>

                    <input type="file" id="arquivo">

                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 NimbuStorage. Todos os direitos reservados.</p>
        </footer>

        <script src="../js/upload.js"></script>
    </body>
</html>
